services:
  squidly-postgres-dev:
    image: postgres:16-alpine
    container_name: squidly-postgres-dev
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  squidly-dev:
    build: .
    container_name: squidly-dev
    env_file:
      - .env.dev
    environment:
      - TZ=UTC
    ports:
      - "5000:5000"
    volumes:
      # Mount downloads folder for track downloads
      - ./downloads:/downloads
      # Mount logs folder for persistent logging
      - ./logs:/logs
    depends_on:
      squidly-postgres-dev:
        condition: service_healthy

volumes:
  postgres_data: