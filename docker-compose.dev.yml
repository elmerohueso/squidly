services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: squidly-postgres-dev
    environment:
      - POSTGRES_DB=squidly_dev
      - POSTGRES_USER=squidly_dev
      - POSTGRES_PASSWORD=squidly_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squidly_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  squidly-dev:
    build: .
    container_name: squidly-dev
    ports:
      - "5005:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://squidly_dev:squidly_dev@postgres-dev:5432/squidly_dev
    volumes:
      # Mount downloads folders for track downloads
      - ./downloads/full_albums:/downloads/full_albums
      - ./downloads/loose_tracks:/downloads/loose_tracks
    depends_on:
      postgres-dev:
        condition: service_healthy

volumes:
  postgres_data_dev: