services:
  squidly-postgres-dev:
    image: postgres:16-alpine
    container_name: squidly-postgres-dev
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  squidly-dev:
    build: .
    container_name: squidly-dev
    env_file:
      - .env.dev
    ports:
      - "5000:5000"
    volumes:
      # Mount downloads folders for track downloads
      - ./downloads/full_albums:/downloads/full_albums
      - ./downloads/loose_tracks:/downloads/loose_tracks
    depends_on:
      squidly-postgres-dev:
        condition: service_healthy

volumes:
  postgres_data: