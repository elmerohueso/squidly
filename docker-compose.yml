services:
  web:
    image: ghcr.io/elmerohueso/squidly:latest
    container_name: squidly-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount data folder for SQLite database and other persistent data
      - ./data:/app/data
      # Mount downloads folders for track downloads
      - "./downloads/full_albums:/app/downloads/full_albums"
      - "./downloads/loose_tracks:/app/downloads/loose_tracks"
