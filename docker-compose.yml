services:
  web:
    build: .
    container_name: squidly-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount JSON file to persist endpoint status
      - ./squidurls.json:/app/squidurls.json
    restart: unless-stopped
    networks:
      - squidly-network

networks:
  squidly-network:
    driver: bridge
