services:
  web:
    build: .
    container_name: squidly-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      # Mount for development - hot reload
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - squidly-network

networks:
  squidly-network:
    driver: bridge
