services:
  squidly-postgres:
    image: postgres:16-alpine
    container_name: squidly-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  squidly:
    image: ghcr.io/elmerohueso/squidly:latest
    container_name: squidly
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # Mount downloads folder for track downloads
      - ./downloads:/downloads
      # Mount logs folder for persistent logging
      - ./logs:/logs
    depends_on:
      squidly-postgres:
        condition: service_healthy

volumes:
  postgres_data:
